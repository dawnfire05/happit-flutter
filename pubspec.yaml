name: happit_flutter
description: "flutter app for happit"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  flutter_local_notifications: ^20.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^17.1.0
  dio: ^5.7.0
  injectable: ^2.5.0
  get_it: ^9.2.0
  retrofit: ^4.4.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  flutter_secure_storage: ^10.0.0
  rxdart: ^0.28.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  dartz: ^0.10.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  go_router_builder: ^4.2.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  retrofit_generator: ^10.2.3
  json_serializable: ^6.8.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - .env

  fonts:
    - family: Montserrat Alternates
      fonts:
        - asset: fonts/MontserratAlternates-ExtraBold.ttf
          weight: 800
    - family: Noto Sans KR
      fonts:
        - asset: fonts/NotoSansKR-Thin.ttf
          weight: 100
        - asset: fonts/NotoSansKR-ExtraLight.ttf
          weight: 200
        - asset: fonts/NotoSansKR-Light.ttf
          weight: 300
        - asset: fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansKR-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansKR-Bold.ttf
          weight: 700
        - asset: fonts/NotoSansKR-ExtraBold.ttf
          weight: 800
        - asset: fonts/NotoSansKR-Black.ttf
          weight: 900
